# Render Blueprint for the GetLeash services (docs/deployment.md, "Host the services and the dashboard").
# The dashboard runs elsewhere (Vercel); this is the executor and the Telegram bot.
#
# The owner key never goes here: setup, seeding and top-ups are signed on the owner's machine. The worker
# holds only the agent's and the executor's function-call keys, which NEAR limits to their own methods
# (propose; create_attempt, fund, forget). Values marked `sync: false` are secrets or belong to one
# deployment: `pnpm deploy:env --network mainnet` writes them to .env.render, to paste into Render.
services:
  # Both services in one process group (scripts/src/services.ts starts either again if it stops), as a
  # web service: it answers GET /healthz on $PORT. On Starter it stays awake and keeps one disk: the
  # executor's journal, the bot's update log, the encrypted invoice store and the record that sends each
  # owner notice once. The free plan sleeps after 15 minutes without requests (the bot then stops
  # answering) and has no disk, so its records start over at each restart (the executor starts quietly).
  - type: web
    name: getleash-services
    runtime: node
    plan: starter
    branch: feature/getleash-core
    # pnpm straight from npm: the corepack bundled with Node 23.4.0 has npm's old signing keys and refuses
    # to download pnpm ("Cannot find matching keyid"). The version is package.json's packageManager.
    buildCommand: npm install -g pnpm@10.33.0 && pnpm install --frozen-lockfile
    startCommand: node --import tsx scripts/src/services.ts
    healthCheckPath: /healthz
    disk:
      name: getleash-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 23.4.0
      - key: GETLEASH_DATA_DIR
        value: /var/data
      - { key: NEAR_NETWORK, sync: false }
      - { key: OWNER_ACCOUNT_ID, sync: false }
      - { key: POLICY_CONTRACT_ID, sync: false }
      - { key: AGENT_ACCOUNT_ID, sync: false }
      - { key: EXECUTOR_ACCOUNT_ID, sync: false }
      - { key: AGENT_PRIVATE_KEY, sync: false }
      - { key: EXECUTOR_PRIVATE_KEY, sync: false }
      - { key: NEAR_AI_API_KEY, sync: false }
      - { key: ONECLICK_JWT, sync: false }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_OWNER_CHAT_ID, sync: false }
      - { key: TELEGRAM_ALLOWED_USER_IDS, sync: false }
      - { key: TELEGRAM_ALLOWED_CHAT_IDS, sync: false }
      - { key: TENANT_SECRET, sync: false }
      - { key: INVOICE_STORE_KEY, sync: false }
      # Supplier names from `pnpm seed`, which the agent matches invoices against. Suppliers added in
      # Telegram (/addsupplier, /invite) need no change here: the bot keeps their names on the disk.
      - { key: GETLEASH_DIRECTORY_BASE64, sync: false }
      # The dashboard's public address, for the links in Telegram.
      - { key: DASHBOARD_URL, sync: false }
