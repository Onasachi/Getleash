[package]
name = "getleash-policy"
description = "GetLeash policy contract: an on-chain spending policy that limits an AI agent paying suppliers across chains."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
license = "MIT"
# NEP-0330 is automatically implemented for all contracts built with https://github.com/near/cargo-near.
# The link is exposed via the `contract_source_metadata` view function.
repository = "https://bitbucket.org/crackedstudios/getleash"

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility, according to specs
# in https://github.com/near/NEPs/blob/master/neps/nep-0330.md
[package.metadata.near.reproducible_build]
# docker image, descriptor of build environment
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
# tag after colon above serves only descriptive purpose; image is identified by digest
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
# list of environment variables names, whose values, if set, will be used as external build parameters
# in a reproducible manner
passed_env = []
# build command inside of docker container
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-embed-abi",
]

[dependencies]
near-sdk = "5.29"
# Same serde near-sdk already uses; needed so schemars-generated ABI code can name `serde::` directly.
serde = "1"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
proptest = "1.12"
near-sandbox = "0.3.12"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true

# `cfg(near)` was introduced in `near-sdk` v5.27.0, and is expected cfg now
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
