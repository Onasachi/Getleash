[package]
name = "getleash-installer"
description = "Installs the GetLeash release on a new, keyless contract account: copies it from the release store, checks its SHA-256, deploys it and calls `new`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
