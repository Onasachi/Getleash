# The tiny contracts behind a setup from a browser wallet (docs/decisions.md D-31, D-32): the release
# store, published once by the operator; the installer, which turns a new account into the release; and
# the factory, which a business's wallet calls once to set everything up. No near-sdk: each is a few KB of
# wasm or less. Build with `pnpm build:installer` (it writes factory/src/config.rs and
# shared/src/installer-wasm.ts).
[workspace]
members = ["installer", "store", "factory"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://bitbucket.org/crackedstudios/getleash"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
